spring.application.name=backend

spring.datasource.url=jdbc:postgresql://ep-muddy-tree-ay809uwn-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=update
community.help-request.expiry-hours=24
community.help-request.expiry-scan-ms=60000
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.admin.emails=${ADMIN_EMAILS:}

app.notifications.email-enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.notifications.recipient=${ALERT_EMAIL_RECIPIENT:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

community.safety-checkin.timeout-minutes=5
community.safety-checkin.scan-ms=60000
